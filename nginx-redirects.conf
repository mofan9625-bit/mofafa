# 3. 参数匹配重定向 (/go.html?id=xxx)
# 服务端直接下发 302，避免多余网络往返；若无参数则交由静态承接页响应
location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    if ($arg_id = "yunjiexian") {
        return 302 https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L;
    }
    if ($arg_id = "dalaoyun") {
        return 302 https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V;
    }
    if ($arg_id = "huanqiuti") {
        return 302 https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU;
    }
    if ($arg_id = "liulianyun") {
        return 302 https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR;
    }
    if ($arg_id = "shenxing") {
        return 302 https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK;
    }
    if ($arg_id = "shandianshu") {
        return 302 https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg;
    }
    if ($arg_id = "edgenova") {
        return 302 https://wep.edgenovaaff.com/#/?code=nr2kdl68;
    }
    if ($arg_id = "sujie") {
        return 302 https://pygllc.speedworldaff.cc/#/?code=f3fRpBfX;
    }

    try_files $uri =404;
}

# 4. /go 目录安全防护与爬虫拦截兜底
location ^~ /go/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri $uri/ /go.html =404;
}

# 5. 修复 Bing 4xx 及破损规范URL状态码 (/tags/disney 及 /cdn-cgi/)
location = /tags/disney {
    return 301 /tags/disney/;
}
location ~* ^/tags/disney(\+|%2b|\s) {
    return 301 /tags/disney/;
}
location ^~ /cdn-cgi/ {
    return 301 /;
}

