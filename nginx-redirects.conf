# ==============================================================================
# 魔法Clash机场知识库 - AFF 推广链接 302 临时重定向规则 (Nginx / 宝塔面板)
# 
# 使用说明：
# 1. VPS / 原生 Nginx 用户：
#    在当前站点的 server { ... } 配置块内添加：
#    include /www/server/nginx/conf/nginx-redirects.conf;  # 或当前站点的绝对路径
#
# 2. 宝塔面板用户：
#    进入【网站】->【设置】->【重定向】或【配置文件】，在 server 块内粘贴此文件内容或 include。
# ==============================================================================

